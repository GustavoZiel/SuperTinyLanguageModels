model:
  core_model:
    core_model_type: generic
    num_layers: 8
    ffn:
      ffn_type: swiglu
      ffn_dim: 1536
      normalization: rms_norm
      bias: false
    attn:
      attn_type: generic
      num_heads: 16
      normalization: rms_norm
      group_size: 4
      bias: false
      is_causal: true
  embedder:
    tokenizer_type: gpt2
    embedding_model_type: generic
    dataset_name: openwebtext
  lm_head:
    normalization: rms_norm
    bias: false
    lm_head_type: generic
  hidden_dim: 512
  context_window: 512
  vocab_size: 50257
  model_shell_type: standard
  embedding_weight_tying: true
  positional_encoding_type: rope
trainer:
  dropout_scheduler:
    dropout_type: constant
    dropout: 0.1
  dataset: openwebtext
  training:
    trainer_type: base_trainer
    batch_size: 24
    gradient_accumulation_steps: 20
    max_iters: 100000
    lr_decay_iters: 100000
    warmup_iters: 5000
    eval_iters: 1000
    eval_interval: 1000
    log_interval: 1000
    prompt_interval: 10000
    checkpoint_interval: 10000
    run_profiler: false
  prompt:
    input_prompts:
      # Geography
      - "The capital of the United States is"
      - "The capital city of Italy is"
      - "The capital of France is"
      - "The tallest mountain in the world is"
      - "The Great Wall of China was built to"
      - "The currency of Japan is"
      - "The longest river in the world is"
      - "The largest continent on Earth is"
      - "The Sahara is a famous"
      - "Mount Everest is located in"
      - "The official language of Brazil is"
      - "The country known as the Land of the Rising Sun is"

      # Science
      - "The largest planet in our solar system is"
      - "The chemical symbol for water is"
      - "The process by which plants make their own food is called"
      - "The theory of relativity was developed by"
      - "The largest mammal on Earth is"
      - "The freezing point of water is"
      - "The hardest natural substance on Earth is"
      - "The basic unit of life is the"
      - "The speed of light is approximately"
      - "The human body has how many bones"
      - "The gas essential for human respiration is"
      - "The center of an atom is called the"

      # Mathematics
      - "The Pythagorean theorem states that"
      - "The smallest prime number is"
      - "4 follows 3 and precedes"
      - "4 follows 3, and 5 follows"
      - "The value of pi is approximately"
      - "The sum of the angles in a triangle is"
      - "The square root of 64 is"
      - "The Roman numeral for 10 is"
      - "A polygon with eight sides is called an"
      - "The result of 7 multiplied by 8 is"

      # General Knowledge
      - "The first president of the United States was"
      - "The main ingredient in guacamole is"
      - "The earth revolves around the"
      - "The seven days of the week are Monday, Tuesday,"
      - "There are 24 hours in a"
      - "The author of 'Romeo and Juliet' is"
      - "The largest ocean on Earth is the"
      - "The inventor of the telephone was"
      - "The color of chlorophyll is"
      - "The currency used in the United Kingdom is"
    generator:
      top_k: 10
      temperature: 0.5
      max_new_tokens: 25
  eval:
    - benchmarks:
        - "winograd"
        - "hellaswag"
        - "arc"
        - "mmlu"
        - "blimp"
      num_samples: 1000
      evaluator: "mcq"
  optimizer:
    name: nanoGPTadamW
    lr: 0.0006
    min_lr: 6.0e-05
    weight_decay: 0.1
    beta1: 0.9
    beta2: 0.95
    grad_clip: 1.0
    decay_lr: true
    warmup_iters: 5000
  lr_scheduler:
    name: cosine
  dataloader:
    name: standard
  datasampling:
    name: standard
  loss_fn:
    name: cross_entropy
general:
  logging:
    wandb_log: true
    wandb_project: SuperTinyLanguageModels
  paths:
    output_dir: outputs
    data_dir: data
    checkpoint_dir: checkpoints
  seed: 489
  device: cuda