# Configuration for resuming training from a checkpoint
# Usage: python train.py --config-name full_configs/resume_training checkpoint=path/to/checkpoint.pt

# Specify the checkpoint to resume from
checkpoint: "checkpoints/20250919_1203_simple_en_wiki_30.pt"  # Change this path as needed

model:
  core_model:
    core_model_type: generic
    num_layers: 8
    ffn:
      ffn_type: swiglu
      ffn_dim: 1320
      normalization: rms_norm
      bias: false
    attn:
      attn_type: generic
      num_heads: 16
      normalization: rms_norm
      group_size: 4
      bias: false
      is_causal: true
  embedder:
    tokenizer_type: gpt2
    embedding_model_type: generic
    dataset_name: simple_en_wiki
  lm_head:
    normalization: rms_norm
    bias: false
    lm_head_type: generic
  hidden_dim: 512
  context_window: 512
  vocab_size: 50257
  model_shell_type: standard
  embedding_weight_tying: true
  positional_encoding_type: rope

trainer:
  dropout_scheduler:
    dropout_type: constant
    dropout: 0.1
  dataset: simple_en_wiki
  training:
    trainer_type: base_trainer
    batch_size: 8
    gradient_accumulation_steps: 8
    max_iters: 30  # Total iterations (will resume from checkpoint iteration)
    lr_decay_iters: 100
    warmup_iters: 5
    eval_interval: 10
    prompt_interval: 5
    log_interval: 1
    eval_iters: 10
    checkpoint_interval: 10
    run_profiler: false
  eval:
    - evaluator: "mcq" 
      benchmarks:
          - "blimp"
      num_samples: 10
  optimizer:
    name: nanoGPTadamW
    lr: 0.0006
    min_lr: 6.0e-05
    weight_decay: 0.1
    beta1: 0.9
    beta2: 0.95
    grad_clip: 1.0
    decay_lr: true
    warmup_iters: 100
  lr_scheduler:
    name: cosine
  dataloader:
    name: standard
  loss_fn:
    name: cross_entropy
  prompt:
    input_prompts:
      - "The capital of Brazil is"
      - "What is the capital of Brazil?"
    generator:
      top_k: 10
      temperature: 0.8
      max_new_tokens: 100

general:
  logging:
    wandb_log: False
    wandb_project: SuperTinyLanguageModels
  paths:
    output_dir: outputs
    data_dir: data
    checkpoint_dir: checkpoints
  seed: 2004
  device: cuda
